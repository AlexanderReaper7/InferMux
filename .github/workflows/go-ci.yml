name: Linux CI

on:
  push:
    branches: ["main"]
    # only run when backend source changes
    # cmd/ is excluded because it contains utilities without tests;
    # cmd/kubeswap is re-included: it has test suites (make test-cmd)
    # and the Helm chart (make test-chart)
    paths:
      - "**/*.go"
      - "!cmd/**"
      - "cmd/kubeswap/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/go-ci.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "**/*.go"
      - "!cmd/**"
      - "cmd/kubeswap/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/go-ci.yml"

  # Allows manual triggering of the workflow
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #6.4.0
        with:
          go-version-file: go.mod

      # Only run in this linux based runner
      - name: Check Formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            gofmt -l .
            exit 1
          fi
      # cache simple-responder to save the build time
      - name: Restore Simple Responder
        id: restore-simple-responder
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: ./build
          key: ${{ runner.os }}-simple-responder-${{ hashFiles('cmd/simple-responder/simple-responder.go') }}

      # necessary for testing proxy/Process swapping
      - name: Create simple-responder
        if: steps.restore-simple-responder.outputs.cache-hit != 'true'
        run: make simple-responder

      - name: Save Simple Responder
        # nothing new to save ... skip this step
        if: steps.restore-simple-responder.outputs.cache-hit != 'true'
        id: save-simple-responder
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: ./build
          key: ${{ runner.os }}-simple-responder-${{ hashFiles('cmd/simple-responder/simple-responder.go') }}

      # internal/muxui writes and reads the keys' sops file through the sops
      # binary. The version is nixpkgs', which the dev shell and the package use.
      - name: Install sops
        run: |
          curl -fsSLo sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  sops" | sha256sum -c -
          sudo install -m 755 sops /usr/local/bin/sops
          rm sops

      - name: Test all
        run: make test-all

      # The cmd utility suites are unix-only (vllm-wrapper uses syscall.Kill).
      - name: Test cmd utilities
        run: make test-cmd

      # Lint + render the kubeswap Helm chart (helm ships on the runner;
      # the fallback keeps the step working if a future image drops it).
      - name: Test chart
        run: |
          if ! command -v helm >/dev/null; then
            curl -fsSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz \
              | sudo tar xz --strip-components=1 -C /usr/local/bin
          fi
          make test-chart
