# The warden's file, passed as -warden-config. Every key is optional; the
# values below are the defaults unless marked otherwise. The NixOS module
# writes this from services.infermux.warden.

# Omit when there is no ComfyUI. Its queue is contention, and it is told to
# /free after comfyui_idle_seconds of empty queue. (No default.)
comfyui_url: http://127.0.0.1:8188

# ComfyUI's systemd unit. Named so that a file listing it in our_units is
# refused: ComfyUI's work is contention, never ours (0002). (No default.)
comfyui_unit: comfyui.service

# systemd units whose GPU work is ours, not contention. InferMux's own unit is
# always ours: the models it starts are its children. (Default: none.)
our_units: [llama-embed.service]

# Process names whose GPU work is neither ours nor contention: the compositor,
# and the Electron GPU process that draws T3 Code's streamed reply. Every
# Electron app shares that name. (Default: none.)
desktop_processes: [cosmic-comp, electron]

# This machine's name among the hosts: the <host> in <host>/<model>, which a
# key's allow list matches. (Default: none.)
host: reaperboi

# The clients' keys, relative to this file. Set, every request but a health
# check needs a key from it (Bearer, x-api-key, the password of Basic, or the
# subprotocol openai-insecure-api-key.<key>), and the key's class decides
# whether it is batch: refused with 503 while paused, cancelled on a yield.
# Unset, no key is needed and every request is interactive. (Default: none.)
keys_file: keys.example.yaml

# The other hosts. Their local models are listed here as <name>/<model> and
# forwarded with the client's own key; key_file is this host's key there, for
# reading the list. (Default: none.)
remotes:
  - name: zbox
    url: https://zbox.tailnet.ts.net:5001
    key_file: /run/credentials/infermux.service/remote-key

# Host names besides localhost, 127.0.0.1 and [::1] that a browser may write
# on, here and in infermux-ui: the name `tailscale serve` publishes them on,
# which it passes through as the Host. A name someone else's DNS could point
# at 127.0.0.1 undoes the rebinding check. (Default: none.)
trusted_hosts: [host.tailnet.ts.net]

policy:
  # Foreign GPU utilization at or above this is contention.
  gpu_busy_percent: 25
  # Read only while no model is loaded. The desktop alone holds 4.2-4.7 GB.
  min_free_vram_mb: 3000
  # Yield at once, come back only after this much quiet.
  resume_quiet_seconds: 300
  # NVML answers in ~6 ms, so a short tick costs nothing.
  poll_seconds: 5
  # How long ComfyUI's queue stays empty before it is told to drop its models.
  comfyui_idle_seconds: 600
  # No unload on a yield while an interactive request is in flight or ended
  # less than this long ago. The unload is paid once it has been quiet.
  interactive_recent_seconds: 600
  # false: measure on request only, announce nothing, unload nothing.
  enabled: true

# Told {"action": "pause"|"resume", "reason", "since", "warden"} on every
# change and every 300 s. announce_path defaults to /api/pipeline/announce.
consumers:
  - name: episteme
    url: http://127.0.0.1:8200
