; Per-model presets for llama-server router mode (--models-preset).
; Section name = model name as served by the router (file name minus .gguf);
; keys = llama-server CLI arguments without the leading dashes (short forms OK).
; [*] applies to every model; a model section overrides it.
;
; NOTE: key names track llama.cpp CLI args and are not fully standardized —
; re-test this file after upgrading llama.cpp.

[*]
fitt = 768
fa = on
; 2026-08-15: ngl = 999 removed. An explicit n_gpu_layers makes the --fit pass
; abort ("n_gpu_layers already set by user to 999, abort"), so every `fit = on`
; below was silently dead and all layers were forced onto the 10 GB card, where
; WDDM spilled them into shared system RAM and the GPU read weights back over
; PCIe. -ngl already defaults to 'auto'. With it gone the fit places 41/42
; layers of the 35B and 26/66 of the 27B, keeping the full ctx.
; 2026-08-15: one window for every model, set while benchmarking Qwen3.8-27B
; against Qwopus3.6-35B-A3B - tok/s is not comparable across different ctx.
; Was 262144 (35B) / 131072 (9B). Revisit once the 27B/35B choice is settled.
ctx-size = 65536

; --- Chat models -----------------------------------------------------------

; episteme `writer`/`main` role
[Qwopus3.6-35B-A3B-Coder-MTP-Q4_K_M]
fit = on
cache-type-k = q5_0
cache-type-v = q4_1
spec-type = draft-mtp
spec-draft-n-max = 3
spec-draft-p-min = 0.75
reasoning-preserve = 1
mmproj = C:\Users\Alexander\models\mmproj\Qwen3.6-35B-A3B-mmproj-BF16.gguf
image-min-tokens = 1024

; Candidate replacement for the `writer`/`main` role above. Dense 27B, so unlike
; the MoE its weights cannot hide behind 3B active params - see the benchmark.
; Qwen shipped no 35B-A3B for 3.8, only this. MTP *is* in the GGUF
; (qwen35.nextn_predict_layers = 1, blk.64.nextn.*) even though upstream left it
; out of the file name; renamed locally to -MTP- to match the other presets.
; Context memory, MEASURED with llama-fit-params at ctx 65536 (2026-08-15), not
; derived from head counts: 1493 MiB here vs 482 MiB on the 35B, i.e. 23 vs
; 7.5 KB/token. Naive layers x kv-heads x dim arithmetic gives ~3.5x too much,
; because Gated DeltaNet layers hold a fixed-size recurrent state instead of a
; KV cache that grows with position. Context is cheap on both; weights are not.
[Qwen3.8-27B-MTP-Q4_K_M]
fit = on
cache-type-k = q5_0
cache-type-v = q4_1
spec-type = draft-mtp
spec-draft-n-max = 3
spec-draft-p-min = 0.75
mmproj = C:\Users\Alexander\models\mmproj\Qwen3.8-27B-mmproj-BF16.gguf
image-min-tokens = 1024

; episteme `fast` role
[Qwythos-9B-Claude-Mythos-5-1M-MTP-Q4_K_M]
fit = on
cache-type-k = q5_0
cache-type-v = q4_1
spec-type = draft-mtp
spec-draft-n-max = 3
spec-draft-p-min = 0.75
mmproj = C:\Users\Alexander\models\mmproj\Qwen3.5-9B-mmproj-BF16.gguf
image-min-tokens = 1024

; --- Embedding models (episteme `embed` role) --------------------------------
; NOT served by the router. The Octen GGUFs live in models\embed\ (out of router
; discovery) and run on a dedicated always-resident llama-server on port 5002,
; spawned by launch-llama-v2.ps1 - flags live there. This lets --models-max 1
; guarantee only one decode model in VRAM without evicting the CPU-only embedder.
; (A preset section with no matching GGUF would register a phantom model, so no
; embed sections belong in this file.)
