# What the warden watches, and who it tells.
#
# Absent or partial is fine: every value below is also a default in config.py, so
# a fresh clone runs with no consumers and therefore nothing to announce to.

[paths]
# The unpacked upstream llama.cpp release. NOT in this repository - it is not
# ours and it is 200 MB of binaries. `LLAMA_CPP_DIR` overrides this. The logs the
# servers write live under it; the launcher and models-preset.ini do not, they
# are in llama/ here.
llama_dir = 'C:\selfhosting\llama-cpp'
models_dir = 'C:\selfhosting\models'

[agent]
host = "127.0.0.1"
port = 5003
router_url = "http://127.0.0.1:5001"

[policy]
# Foreign GPU utilization at or above this counts as contention. 25% is well
# above an idle desktop's compositor and well below anything that renders.
gpu_busy_percent = 25.0
# Only consulted while our own models are unloaded, where the whole figure is by
# definition somebody else's. ~6 GB is what the smallest decode model needs.
min_free_vram_mb = 6000
# Asymmetric on purpose: yield at once, come back only after this much quiet.
resume_quiet_seconds = 300
# One tick costs ~3.5s of PDH sampling, so this is the trade between host CPU and
# how long a 20 GB model stays resident after somebody alt-tabs into a game.
poll_seconds = 30.0
enabled = true

# One table per consumer. `url` is a base; `announce_path` defaults to
# /api/pipeline/announce. Episteme reaches the host over the loopback because
# the warden runs beside Docker, not inside it.
[[consumers]]
name = "episteme"
url = "http://127.0.0.1:8200"
