# What the warden watches, and who it tells.
#
# Absent or partial is fine: every value below is also a default in config.py, so
# a fresh clone runs with no consumers and therefore nothing to announce to. The
# NixOS module generates its own copy of this file and points WARDEN_CONFIG at it.

[agent]
host = "127.0.0.1"
port = 5003
# Asked whether it holds a model, and told to unload them all on a yield.
router_url = "http://127.0.0.1:5001"
# Omit when there is no ComfyUI. Its queue is contention, and it is told to
# /free after comfyui_idle_seconds of empty queue.
comfyui_url = "http://127.0.0.1:8188"
# systemd units whose GPU work is ours, not contention.
our_units = ["llama-cpp.service", "llama-embed.service"]

[policy]
# Foreign GPU utilization at or above this counts as contention. 25% is well
# above an idle desktop's compositor and well below anything that renders.
gpu_busy_percent = 25.0
# Only consulted while our own models are unloaded, where the whole figure is by
# definition somebody else's. The desktop alone holds 4.2 to 4.7 GB of the 10 GB,
# so the Windows value of 6000 would never resume. See config.Policy.
min_free_vram_mb = 3000
# Asymmetric on purpose: yield at once, come back only after this much quiet.
resume_quiet_seconds = 300
# NVML answers in ~6 ms, so a short tick costs nothing and bounds the yield latency.
poll_seconds = 5.0
# How long ComfyUI's queue stays empty before it is told to drop its models.
comfyui_idle_seconds = 600
enabled = true

# One table per consumer. `url` is a base; `announce_path` defaults to
# /api/pipeline/announce.
[[consumers]]
name = "episteme"
url = "http://127.0.0.1:8200"
