[project]
name = "llama-warden"
version = "0.2.0"
description = "Decides when the GPU is contended and tells its consumers to let go of it"
requires-python = ">=3.12"
# Kept short on purpose: the HTTP service and NVML. Everything else it needs
# (TOML, HTTP client, threads) is the standard library. The floors are what
# nixpkgs ships, since the NixOS package builds against those, not PyPI's
# latest: uvicorn 0.51.0 there against 0.52.4 on PyPI (2026-09-28).
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.51.0",
    "nvidia-ml-py>=13.610.43",
]

[project.scripts]
warden = "warden.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "B008",  # `= Body(...)` in a signature is how FastAPI declares a body
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
